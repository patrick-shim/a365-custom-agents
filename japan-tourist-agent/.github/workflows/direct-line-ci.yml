name: OBO Direct Line Frontend CI

"on":
  push:
    paths:
      - "a365-tourist-agent-obo-directline/**"
      - ".github/workflows/direct-line-ci.yml"
  pull_request:
    paths:
      - "a365-tourist-agent-obo-directline/**"
      - ".github/workflows/direct-line-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: a365-tourist-agent-obo-directline

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.110

      - name: Reject committed credentials and foreign source
        shell: pwsh
        run: |
          $tracked = @(git ls-files -- .)
          if ($tracked.Count -eq 0) {
            throw 'Direct Line tracked-file validation returned no files.'
          }
          $forbidden = @($tracked | Where-Object {
            $_ -match '(^|/)(?:\.a365|\.azure|\.copilot-azure|\.config|manifest)(?:/|$)' -or
            $_ -match '(^|/)(?:a365\.config\.json|a365\.generated\.config\.json|\.a365-workspace-detection\.local\.json|manifest\.zip|ToolingManifest\.json|client_key\.key|\.env(?:\.(?!example$).*)?|[^/]+\.(?:key|pem|pfx|p12))$' -or
            $_ -match '^(?:server|infra|tools|teams)/' -or
            $_ -match '^(?:Dockerfile(?:\..*)?|JapanExpertAgent\.slnx)$'
          })
          if ($forbidden.Count -gt 0) {
            throw "Direct Line credentials, operational state, or foreign source are committed: $($forbidden -join ', ')"
          }

      - name: Test Direct Line frontend
        shell: pwsh
        run: dotnet test JapanExpert.OBO.DirectLine.slnx --configuration Release

      - name: Validate Direct Line icon
        shell: pwsh
        run: |
          $icon = 'direct/assets/japan-expert.ico'
          $bytes = [IO.File]::ReadAllBytes($icon)
          if ($bytes.Length -lt 6 -or
              $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or
              $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
            throw 'Direct Line application icon must be a valid ICO file.'
          }
          Add-Type -AssemblyName System.Drawing.Common
          $applicationIcon = [Drawing.Icon]::new((Resolve-Path $icon).Path)
          try {
            $bitmap = $applicationIcon.ToBitmap()
            try {
              $center = $bitmap.GetPixel(
                [int] ($bitmap.Width / 2),
                [int] ($bitmap.Height / 2))
              if ($bitmap.Width -ne 256 -or $bitmap.Height -ne 256 -or
                  $center.R -ne 188 -or $center.G -ne 0 -or $center.B -ne 45) {
                throw 'Direct Line application icon must use the 256x256 Japan Tourist Expert flag artwork.'
              }
            }
            finally {
              $bitmap.Dispose()
            }
          }
          finally {
            $applicationIcon.Dispose()
          }

      - name: Validate Direct Line contract pin
        shell: pwsh
        run: |
          $lock = Get-Content backend-contract.lock.json -Raw | ConvertFrom-Json
          if ($lock.contractId -ne 'japan-expert-shared-backend' -or
              $lock.contractVersion -ne '2.0.0' -or
              $lock.productName -ne 'Japan Tourist Expert' -or
              $lock.defaultTimeZone -ne 'Asia/Tokyo' -or
              $lock.defaultCurrency -ne 'JPY' -or
              $lock.frontend -ne 'on-behalf-of' -or
              $lock.route -ne '/api/messages/obo' -or
              $lock.audienceConfiguration -ne 'TokenValidation__Audiences__OnBehalfOf' -or
              $lock.identityBinding -ne 'configured-obo-child-agent-identity') {
            throw 'Invalid OBO Direct Line backend contract pin.'
          }
