name: AI Teammate Frontend CI

"on":
  push:
    paths:
      - "a365-tourist-agent-teammate/**"
      - ".github/workflows/ai-teammate-ci.yml"
  pull_request:
    paths:
      - "a365-tourist-agent-teammate/**"
      - ".github/workflows/ai-teammate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: a365-tourist-agent-teammate

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend contract pin
        shell: pwsh
        run: |
          $lock = Get-Content backend-contract.lock.json -Raw | ConvertFrom-Json
          if ($lock.contractId -ne 'japan-expert-shared-backend' -or
              $lock.contractVersion -ne '2.0.0' -or
              $lock.productName -ne 'Japan Tourist Assistant' -or
              $lock.defaultTimeZone -ne 'Asia/Tokyo' -or
              $lock.defaultCurrency -ne 'JPY' -or
              $lock.frontend -ne 'agentic-user' -or
              $lock.route -ne '/api/messages' -or
              $lock.audienceConfiguration -ne 'TokenValidation__Audiences__AgenticUser' -or
              $lock.identityBinding -ne 'dynamic-child-agent-identity') {
            throw 'Invalid AI Teammate backend contract pin.'
          }
          $sdk = Get-Content global.json -Raw | ConvertFrom-Json
          if ($sdk.sdk.version -ne '10.0.110' -or $sdk.sdk.allowPrerelease -ne $false) {
            throw 'Invalid AI Teammate .NET SDK pin.'
          }
          function Get-PngDimensions([string] $Path) {
            $bytes = [IO.File]::ReadAllBytes($Path)
            $signature = [byte[]] @(137, 80, 78, 71, 13, 10, 26, 10)
            $hasSignature = $bytes.Length -ge 24
            for ($index = 0; $hasSignature -and $index -lt $signature.Length; $index++) {
              $hasSignature = $bytes[$index] -eq $signature[$index]
            }
            if (-not $hasSignature) {
              throw "'$Path' is not a valid PNG file."
            }
            [pscustomobject] @{
              Width = ($bytes[16] -shl 24) -bor ($bytes[17] -shl 16) -bor
                ($bytes[18] -shl 8) -bor $bytes[19]
              Height = ($bytes[20] -shl 24) -bor ($bytes[21] -shl 16) -bor
                ($bytes[22] -shl 8) -bor $bytes[23]
            }
          }
          $color = Get-PngDimensions 'assets/color.png'
          $outline = Get-PngDimensions 'assets/outline.png'
          if ($color.Width -ne 192 -or $color.Height -ne 192) {
            throw 'AI Teammate color icon must be 192x192.'
          }
          if ($outline.Width -ne 32 -or $outline.Height -ne 32) {
            throw 'AI Teammate outline icon must be 32x32.'
          }

      - name: Reject committed Agent 365 operational state
        shell: pwsh
        run: |
          $tracked = @(git ls-files -- .)
          if ($tracked.Count -eq 0) {
            throw 'AI Teammate tracked-file validation returned no files.'
          }
          $forbidden = @($tracked | Where-Object {
            $_ -match '(^|/)(?:a365\.config\.json|a365\.generated\.config\.json|\.a365-workspace-detection\.local\.json|manifest\.zip|ToolingManifest\.json|\.env(?:\.(?!example$).*)?|[^/]+\.(?:key|pem|pfx|p12))$' -or
            $_ -match '(^|/)(?:\.a365|\.azure|\.copilot-azure|\.config|manifest)(?:/|$)' -or
            $_ -match '^(?:direct|server|infra|tests|tools|teams)/' -or
            $_ -match '^(?:Dockerfile(?:\..*)?|.*\.csproj|.*\.slnx|Directory\.(?:Build|Packages)\.props)$'
          })
          if ($forbidden.Count -gt 0) {
            throw "Protected Agent 365 operational state or foreign source is committed: $($forbidden -join ', ')"
          }
