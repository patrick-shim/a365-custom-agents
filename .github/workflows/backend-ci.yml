name: Backend CI

"on":
  push:
    paths:
      - "a365-tourist-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "a365-tourist-backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: a365-tourist-backend

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.110

      - name: Run local CI
        shell: pwsh
        run: ./tools/Invoke-LocalCi.ps1 -Configuration Release
